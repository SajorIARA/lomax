<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Detalle - Lomax</title></head><body><a href="/">← Catálogo</a><div id="d"></div><script>const id=new URLSearchParams(location.search).get('id');fetch('/api/productos/'+id).then(r=>r.json()).then(p=>{document.getElementById('d').innerHTML=`<h1>${p.nombre}</h1><img src="/api/productos/${p.id}/imagen?tipo=thumb" style="max-width:300px"><p>${p.descripcion}</p><p><b>$${p.precio}</b> · ${p.categoria} · ${p.estado}</p><pre>${JSON.stringify(p.atributos,null,2)}</pre><img src="/api/productos/${p.id}/imagen" style="max-width:600px"><p><small>código: ${p.codigo}</small></p>`})</script></body></html>
