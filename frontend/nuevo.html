<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Registrar - Lomax</title></head><body><a href="/">← Catálogo</a><h1>Registrar producto</h1><form id="f"><input name="codigo" placeholder="código único" required><input name="nombre" placeholder="nombre" required><input name="descripcion" placeholder="descripción" required><input name="precio" type="number" step="0.01" min="0" placeholder="precio" required><select name="categoria"><option>teclados</option><option>pantallas</option><option>audio</option></select><textarea name="atributos" placeholder='{"switch":"blue"}'></textarea><input type="file" name="file" accept=".jpg,.jpeg,.png"><button>Guardar</button></form><pre id="out"></pre><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);const body={codigo:fd.get('codigo'),nombre:fd.get('nombre'),descripcion:fd.get('descripcion'),precio:parseFloat(fd.get('precio')),categoria:fd.get('categoria'),atributos:JSON.parse(fd.get('atributos')||'{}')};let r=await fetch('/api/productos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let j=await r.json();document.getElementById('out').textContent=r.status+' '+JSON.stringify(j);if(j.producto_id&&fd.get('file').size){const f2=new FormData();f2.append('file',fd.get('file'));let r2=await fetch('/api/productos/'+j.producto_id+'/imagen',{method:'POST',body:f2});document.getElementById('out').textContent+='\n'+r2.status+' '+JSON.stringify(await r2.json())}}</script></body></html>
