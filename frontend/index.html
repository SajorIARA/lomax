<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lomax SA - Catálogo</title><style>body{font-family:system-ui;margin:0}header{background:#111;color:#fff;padding:12px 20px;display:flex;justify-content:space-between}a{color:#0b5fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;padding:20px}.card{border:1px solid #ddd;border-radius:10px;overflow:hidden}.card img{width:100%;height:150px;object-fit:cover;background:#eee}.card div{padding:10px}</style></head><body><header><b>Lomax SA</b><nav><a style="color:#fff" href="/">Catálogo</a> | <a style="color:#fff" href="/nuevo.html">Registrar</a></nav></header><main><h2 style="padding:0 20px">Catálogo (solo PUBLICADOS)</h2><div id="grid" class="grid"></div></main><script>fetch('/api/productos').then(r=>r.json()).then(ps=>{const g=document.getElementById('grid');g.innerHTML=ps.map(p=>`<div class="card"><img src="${p.miniatura}" loading="lazy"><div><b>${p.nombre}</b><br>$${p.precio} · ${p.categoria}<br><a href="/producto.html?id=${p.id}">Ver detalle</a></div></div>`).join('')||'<p style="padding:20px">Sin publicados</p>'})</script></body></html>
